name: Monitors
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig
targets:
  Monitors:
    type: application
    platform: macOS
    sources:
      - path: Monitors
        excludes:
          - AppIcon.icon
      - path: Monitors/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Monitors
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monitors
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Monitors/Monitors.entitlements
      properties: {}
